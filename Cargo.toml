[workspace]
resolver = "2"
members = ["crates/core", "crates/adb", "crates/uia2", "crates/tiktok", "hive"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rhombicdodecahedron/hive"
authors = ["Alexis Stella"]
rust-version = "1.85"

[workspace.dependencies]
hive-core = { path = "crates/core" }
hive-adb = { path = "crates/adb" }
hive-uia2 = { path = "crates/uia2" }
hive-tiktok = { path = "crates/tiktok" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
ureq = { version = "3", features = ["json"] }
rand = "0.9"
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"
jiff = { version = "0.2", features = ["serde"] }
anyhow = "1"
dirs = "6"
ctrlc = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
