name: Bug report
description: Something in Hive doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Keep errors and output exactly as they appear.

        One problem per issue, please. If a step says TikTok's button "wasn't there", use the
        **TikTok changed** form instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/Rhombicdodecahedron/hive/issues?q=is%3Aissue) and this hasn't been reported yet.
          required: true
        - label: I'm on the latest version, or I noted below that I can't update.
          required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Paste the output of `hive --version` and `hive phones`, your computer's OS, and the TikTok
        version on the phone (Settings › Apps › TikTok). Remove anything personal.
      render: text
      placeholder: |
        hive 0.1.0
        Pixel 8  38291FDH2000ZM  ready
            Android 16, battery 100% charging, screen off, lock: no code, TikTok installed
        Arch Linux, TikTok 47.0.3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, from a phone that was plugged in and asleep.
      placeholder: |
        1. hive post clip.mp4 -a @mypage --draft
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with Hive's full output. A screenshot of the phone helps; crop out notifications and personal content.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else, such as whether it worked in an earlier version, or with another phone.
