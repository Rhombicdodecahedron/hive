name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        One request per issue, please.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/Rhombicdodecahedron/hive/issues?q=is%3Aissue) and this hasn't been requested yet.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work, from the command line, the dashboard or the API.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's done. One observable behavior per line.
      placeholder: |
        - [ ] `hive post` takes `--schedule-in 2h`
        - [ ] the dashboard shows the time it will post
    validations:
      required: true
